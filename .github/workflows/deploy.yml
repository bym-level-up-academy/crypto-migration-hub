name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build site
        run: |
          # Détection automatique de la base URL
          if [[ "${{ github.event.repository.name }}" == *".github.io" ]]; then
            export BASE_PATH="/"
          else
            export BASE_PATH="/${{ github.event.repository.name }}/"
          fi
          export GITHUB_PAGES="1"
          echo "Building with BASE_PATH=$BASE_PATH"
          bun run build

      - name: Prepare GitHub Pages artifacts
        run: |
          mkdir -p build-pages
          
          # Détection du dossier de sortie généré (Nitro ou Vite)
          if [ -d ".output/public" ] && [ -f ".output/public/index.html" ]; then
            echo "Dossier détecté : .output/public"
            cp -r .output/public/. build-pages/
          elif [ -d "dist/client" ] && [ -f "dist/client/index.html" ]; then
            echo "Dossier détecté : dist/client"
            cp -r dist/client/. build-pages/
          elif [ -d "dist" ] && [ -f "dist/index.html" ]; then
            echo "Dossier détecté : dist"
            cp -r dist/. build-pages/
          else
            echo "Recherche de l'index.html..."
            FOUND=$(find . -name "index.html" -not -path "*/node_modules/*" -not -path "*/.git/*" -not -path "./build-pages/*" | head -n 1)
            if [ -n "$FOUND" ]; then
              SOURCE_DIR=$(dirname "$FOUND")
              echo "Dossier trouvé : $SOURCE_DIR"
              cp -r "$SOURCE_DIR/." build-pages/
            else
              echo "Erreur : index.html introuvable après la compilation."
              exit 1
            fi
          fi

          # Empêcher Jekyll d'ignorer les dossiers commençant par un underscore (_build, etc.)
          touch build-pages/.nojekyll

          # Gestion du fallback SPA pour les rechargements de page
          if [ -f build-pages/index.html ]; then
            cp build-pages/index.html build-pages/404.html
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

